name: Release Test Binaries

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-test-${{ github.sha }}
  cancel-in-progress: false

env:
  NEOLINK_BUILD_COMMIT: ${{ github.sha }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      short_commit: ${{ steps.identity.outputs.short_commit }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Identify the test release
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEOLINK_BUILD_COMMIT"
          short_commit="${NEOLINK_BUILD_COMMIT:0:12}"
          tag="test-$short_commit"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$NEOLINK_BUILD_COMMIT"
          fi
          if state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$state" != true ]; then
              echo "::error::A published release already exists for $tag. Select another commit."
              exit 1
            fi
          fi
          echo "short_commit=$short_commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test release packaging
        run: python -m unittest discover -s ci/tests -v

  binaries:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libgstreamer1.0-dev libgstrtspserver-1.0-dev libglib2.0-dev \
            protobuf-compiler gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
          # This is a native ARM runner; override the cross-linker in .cargo/config.toml.
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=gcc" >> "$GITHUB_ENV"
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install gstreamer pkgconf openssl@3 protobuf
          gst_root=$(brew --prefix gstreamer)
          openssl_root=$(brew --prefix openssl@3)
          echo "GSTREAMER_1_0_ROOT_MACOSX=$gst_root" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$openssl_root" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$gst_root/lib/pkgconfig:$openssl_root/lib/pkgconfig:$(brew --prefix glib)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/setup-test-release-windows.ps1
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-release-${{ matrix.target }}
      - name: Build, package and smoke-test
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$RELEASE_TARGET"
          python ci/test_release.py package --commit "$NEOLINK_BUILD_COMMIT" \
            --repository "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --verify
      - uses: actions/upload-artifact@v7
        with:
          name: test-binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docker:
    needs: [prepare, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Name the test image
        id: image
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the test image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=Neolink test build
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=test-release
          cache-to: type=gha,scope=test-release,mode=max
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
            NEOLINK_BUILD_COMMIT=${{ github.sha }}
            REVISION=${{ github.sha }}
            REPO=${{ github.server_url }}/${{ github.repository }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
            OWNER=${{ github.repository_owner }}

  release:
    needs: [prepare, binaries, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          pattern: test-binary-*
          path: dist
          merge-multiple: true
      - name: Package source, provenance and checksums
        shell: bash
        env:
          TEST_IMAGE: ${{ needs.docker.outputs.image }}
          TEST_IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          python ci/test_release.py source --commit "$NEOLINK_BUILD_COMMIT" \
            --repository "$GITHUB_REPOSITORY"
          python ci/test_release.py notes --commit "$NEOLINK_BUILD_COMMIT" \
            --repository "$GITHUB_REPOSITORY" --image "$TEST_IMAGE" \
            --digest "$TEST_IMAGE_DIGEST"
      - name: Publish the test prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SHORT_COMMIT: ${{ needs.prepare.outputs.short_commit }}
        run: |
          set -euo pipefail
          notes="dist/TEST-RELEASE-$SHORT_COMMIT.md"
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            test "$state" = true
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$NEOLINK_BUILD_COMMIT"
            gh release edit "$RELEASE_TAG" --notes-file "$notes" --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" --target "$NEOLINK_BUILD_COMMIT" \
              --title "Test build $SHORT_COMMIT" --notes-file "$notes" \
              --draft --prerelease --latest=false
          fi
          # Upload into a draft first so users only see the completed set of assets.
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
